name: Reconstruct Gold Reaper source

on:
  push:
    branches:
      - work/gold-reaper-marketclose-sessionfix
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/gold-reaper-marketclose-sessionfix
          fetch-depth: 0

      - name: Reconstruct and verify source
        shell: bash
        run: |
          cat .upload/part*.b64 | base64 -d > /tmp/gold-reaper.mq5.gz
          gzip -dc /tmp/gold-reaper.mq5.gz > 'The Gold Reaper OderSend v4.5_MarketClose_SessionFix.mq5'
          python - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('The Gold Reaper OderSend v4.5_MarketClose_SessionFix.mq5')
          expected = '28a16045d0bfbba04095ea17aa5325cf5361c7ea1abde7b21bb7a774c8c09118'
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA-256 mismatch: {actual} != {expected}')
          print(f'SHA-256 verified: {actual}')
          PY

      - name: Commit clean working branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'The Gold Reaper OderSend v4.5_MarketClose_SessionFix.mq5'
          git rm -r -- .upload
          git rm -- .github/workflows/reconstruct-gold-reaper.yml
          git commit -m 'Add Gold Reaper MarketClose SessionFix source'
          git push origin HEAD:work/gold-reaper-marketclose-sessionfix
